<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cook.io</title>
  
  <!-- favicon -->
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

  <!-- theme js -->
  <script src="./assets/js/theme.js"></script>

  <!-- Google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap"
    rel="stylesheet">

  <!-- material icon -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />

  <!-- custom css -->
  <link rel="stylesheet" href="./assets/css/style.css">
  <script type="module" src="./assets/js/login.js"></script>

</head>
<body>

  <!-- HEADER -->
  <header class="header" data-header>
    <a href="" class="logo">
      <img src="./assets/images/logo-light.svg" width="156" height="32" alt="Cook.io" class="logo-light">
      <img src="./assets/images/logo-dark.svg" width="156" height="32" alt="Cook.io" class="logo-dark">
    </a>

    <button class="icon-btn theme-switch has-state" aria-pressed="false" aria-label="Toggle light and dark theme"
      data-theme-btn>
      <span class="material-symbols-outlined light-icon" aria-hidden="true">light_mode</span>
      <span class="material-symbols-outlined dark-icon" aria-hidden="true">dark_mode</span>
    </button>
  </header>

  <!-- MAIN -->
  <main>
    <article>
        <section class="hero" aria-label="banner">
        <div class="banner-card">
          <h1 class="display-large">Your desired dish?</h1>

          

          <p class="label-medium">
            Search any recipe e.g: burger, pizza, sandwich, toast.
          </p>

        </div>
      </section>
      <section class="login-section container">
        <h2>Login / Signup</h2>

        <!-- Email input -->
        <div class="input-group">
          <input type="email" id="email" required class="input">
          <label for="email">Email Address</label>
        </div>

        <!-- Password input -->
        <div class="input-group">
          <input type="password" id="password" required class="input">
          <label for="password">Password</label>
        </div>

        <div class="login-buttons">
          <button id="signupBtn" class="btn btn-primary">Sign Up</button>
          <button id="loginBtn" class="btn btn-secondary">Login</button>
        </div>

        <p id="statusMsg"></p>
      </section>
    </article>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p class="copyright body-medium">Copyright 2025 Esha</p>
    <a href="" class="logo">
      <img src="./assets/images/logo-light.svg" width="156" height="32" alt="Cook.io" class="logo-light">
      <img src="./assets/images/logo-dark.svg" width="156" height="32" alt="Cook.io" class="logo-dark">
    </a>
    <a href="https://spoonacular.com/food-api" target="_blank" class="spoonacular">
      <img src="./assets/images/spoonacular.svg" width="300" height="80" loading="lazy"
        alt="spoonacular free recipe api">
    </a>
  </footer>

  <!-- Firebase Auth Logic -->
  <script type="module">
    import { auth } from "./assets/js/firebase.js";
    import { 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("password");
    const signupBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");
    const statusMsg = document.getElementById("statusMsg");

    // Signup
    signupBtn.addEventListener("click", async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value);
        statusMsg.textContent = "Signup successful ✅ Redirecting...";
        setTimeout(() => window.location.href = "index.html", 1000);
      } catch (err) {
        statusMsg.textContent = err.message;
      }
    });

    // Login
    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
        statusMsg.textContent = "Login successful 🎉 Redirecting...";
        setTimeout(() => window.location.href = "index.html", 1000);
      } catch (err) {
        statusMsg.textContent = err.message;
      }
    });

    // Auto Redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
